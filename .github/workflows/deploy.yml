name: Unzip, Build and Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip newest project zip
        run: |
          ls -1 *.zip
          NEWEST=""; BEST=0
          for f in *.zip; do
            T=$(git log -1 --format=%ct -- "$f")
            if [ "$T" -gt "$BEST" ]; then BEST=$T; NEWEST="$f"; fi
          done
          echo "Using: $NEWEST"
          mkdir -p work
          unzip -oq "$NEWEST" -d work
          APP=$(dirname "$(find work -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "APP_DIR=$APP" >> "$GITHUB_ENV"
          echo "Project folder: $APP"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
